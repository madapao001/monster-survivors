<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博券池 | 霓虹抽奖</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ff;
      --neon-purple: #bd00ff;
      --neon-yellow: #fcee0a;
      --dark-bg: #050510;
      --panel-bg: rgba(10, 10, 30, 0.85);
      --grid-color: rgba(0, 243, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--dark-bg);
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 赛博网格背景 */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .cyber-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, var(--dark-bg) 75%);
    }

    /* 扫描线 */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
      z-index: 1;
      animation: scanlineMove 8s linear infinite;
    }

    @keyframes scanlineMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* 浮动粒子 */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--neon-cyan);
      border-radius: 50%;
      opacity: 0.6;
      animation: floatUp linear infinite;
      box-shadow: 0 0 6px var(--neon-cyan);
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 标题区 */
    header {
      text-align: center;
      padding: 40px 0 30px;
    }

    .glitch-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 6px;
      position: relative;
      text-shadow:
        0 0 10px var(--neon-cyan),
        0 0 40px var(--neon-cyan),
        0 0 80px var(--neon-cyan);
      animation: glitchText 3s infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch-title::before {
      color: var(--neon-pink);
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      animation: glitch1 2.5s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      color: var(--neon-cyan);
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      animation: glitch2 3s infinite linear alternate-reverse;
    }

    @keyframes glitchText {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-3px, 1px); }
      94% { transform: translate(3px, -1px); }
      96% { transform: translate(-2px, 2px); }
    }

    @keyframes glitch1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 0); }
      40% { transform: translate(3px, 0); }
      60% { transform: translate(-1px, 0); }
      80% { transform: translate(2px, 0); }
    }

    @keyframes glitch2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(3px, 0); }
      40% { transform: translate(-3px, 0); }
      60% { transform: translate(1px, 0); }
      80% { transform: translate(-2px, 0); }
    }

    .subtitle {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      color: var(--neon-pink);
      letter-spacing: 8px;
      margin-top: 12px;
      opacity: 0.85;
      text-shadow: 0 0 10px var(--neon-pink);
    }

    /* 角标装饰 */
    .cyber-card {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      position: relative;
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border-top: 3px solid var(--neon-cyan);
      border-left: 3px solid var(--neon-cyan);
    }

    .cyber-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 20px;
      height: 20px;
      border-bottom: 3px solid var(--neon-cyan);
      border-right: 3px solid var(--neon-cyan);
    }

    .card-inner {
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: var(--neon-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .card-title .icon {
      font-size: 1.3rem;
    }

/* 输入框 */
    .cyber-input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cyber-input {
      flex: 1;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #fff;
      padding: 12px 16px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .cyber-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .cyber-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* 按钮 */
    .cyber-btn {
      position: relative;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(189, 0, 255, 0.15));
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 28px;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
      overflow: hidden;
    }

    .cyber-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .cyber-btn:hover::before {
      left: 100%;
    }

    .cyber-btn:hover {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(189, 0, 255, 0.3));
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      transform: translateY(-1px);
    }

    .cyber-btn:active {
      transform: translateY(1px);
    }

    .cyber-btn.pink {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.15), rgba(189, 0, 255, 0.15));
    }

    .cyber-btn.pink:hover {
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(189, 0, 255, 0.3));
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
    }

    .cyber-btn.yellow {
      border-color: #00ccff;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(90deg, #00ccff, #3388ff, #cc33ff, #ff00ff);
      background-size: 200% 100%;
      box-shadow: 0 0 25px rgba(0, 204, 255, 0.4), 0 0 50px rgba(255, 0, 255, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.15);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
      animation: neonShift 3s ease infinite;
    }

    @keyframes neonShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .cyber-btn.yellow:hover {
      box-shadow: 0 0 40px rgba(0, 204, 255, 0.7), 0 0 80px rgba(255, 0, 255, 0.5), 0 0 120px rgba(0, 204, 255, 0.2), inset 0 0 25px rgba(255, 255, 255, 0.25);
      transform: translateY(-2px) scale(1.02);
    }

    .cyber-btn.yellow:active {
      transform: translateY(1px) scale(0.98);
    }

    .cyber-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 优惠券列表 */
    .coupon-list {
      margin-top: 16px;
      max-height: 300px;
      overflow-y: auto;
    }

    .coupon-list::-webkit-scrollbar {
      width: 6px;
    }

    .coupon-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    .coupon-list::-webkit-scrollbar-thumb {
      background: var(--neon-cyan);
      border-radius: 3px;
    }

    .coupon-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0, 243, 255, 0.05);
      border-left: 3px solid var(--neon-cyan);
      margin-bottom: 8px;
      transition: all 0.3s;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
    }

    .coupon-item:hover {
      background: rgba(0, 243, 255, 0.1);
      transform: translateX(4px);
    }

    .coupon-item.used {
      opacity: 0.4;
      border-left-color: #666;
      text-decoration: line-through;
    }

    .coupon-item .remove-btn {
      background: transparent;
      border: none;
      color: #ff4444;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0 6px;
      transition: transform 0.2s;
    }

    .coupon-item .remove-btn:hover {
      transform: scale(1.3);
    }

    .coupon-tag {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 2px;
      margin-left: 10px;
    }

    .coupon-tag.available {
      background: rgba(0, 243, 255, 0.2);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .coupon-tag.used {
      background: rgba(255, 0, 0, 0.2);
      color: #ff6666;
      border: 1px solid #ff4444;
    }

    .value-tag {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 2px;
      margin-left: 8px;
      font-family: 'Orbitron', monospace;
    }

    .value-tag.v5 {
      background: rgba(252, 238, 10, 0.15);
      color: var(--neon-yellow);
      border: 1px solid var(--neon-yellow);
    }

    .value-tag.v3 {
      background: rgba(0, 243, 255, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .value-select {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .value-select label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s;
      font-family: 'Orbitron', monospace;
    }

    .value-select label:hover {
      border-color: rgba(255,255,255,0.3);
    }

    .value-select input[type="radio"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .value-select input[type="radio"]:checked {
      border-color: var(--neon-pink);
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    .value-select input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 4px; height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    /* 统计信息 */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 243, 255, 0.15);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 15px rgba(252, 238, 10, 0.5);
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      letter-spacing: 2px;
    }

    /* 抽奖区域 */
    .draw-section {
      text-align: center;
      padding: 40px 24px;
    }

    .draw-wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 32px;
    }

    .draw-wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--neon-cyan);
      position: relative;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.1) 0%, transparent 70%);
      box-shadow:
        0 0 30px rgba(0, 243, 255, 0.2),
        inset 0 0 30px rgba(0, 243, 255, 0.1);
      animation: wheelPulse 2s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes wheelPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 243, 255, 0.1); }
      50% { box-shadow: 0 0 60px rgba(0, 243, 255, 0.4), inset 0 0 50px rgba(0, 243, 255, 0.2); }
    }

    .wheel-inner {
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 243, 255, 0.4);
      animation: wheelSpin 20s linear infinite;
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .wheel-center {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .wheel-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px var(--neon-cyan));
      animation: iconFloat 3s ease-in-out infinite;
      border-radius: 50%;
    }

    .draw-wheel.spinning .wheel-icon {
      animation: iconSpin 0.3s linear infinite;
    }

    @keyframes iconSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .wheel-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--neon-cyan);
      margin-top: 8px;
      letter-spacing: 3px;
    }

    .wheel-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(189, 0, 255, 0.3);
      animation: wheelSpin 15s linear infinite reverse;
    }

    .wheel-ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 0, 255, 0.2);
    }

    /* 抽奖时动画 */
    .draw-wheel.spinning {
      animation: wheelSpinFast 0.1s linear infinite, wheelPulse 0.5s ease-in-out infinite;
    }

    @keyframes wheelSpinFast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 用户信息输入 */
    .user-form {
      max-width: 400px;
      margin: 0 auto 24px;
    }

    .user-form .cyber-input {
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
    }

    .draw-btn {
      font-size: 1.2rem;
      padding: 16px 48px;
      letter-spacing: 4px;
    }

    .draw-btn .btn-glitch {
      display: inline-block;
      animation: btnGlitch 2s infinite;
    }

    @keyframes btnGlitch {
      0%, 100% { transform: translate(0); }
      92% { transform: translate(0); }
      93% { transform: translate(-2px, 1px); }
      94% { transform: translate(2px, -1px); }
      95% { transform: translate(0); }
    }

    /* 结果展示 */
    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }

    .result-overlay.active {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-card {
      background: var(--panel-bg);
      border: 2px solid var(--neon-yellow);
      padding: 40px 50px;
      text-align: center;
      position: relative;
      max-width: 90%;
      width: 500px;
      box-shadow:
        0 0 40px rgba(252, 238, 10, 0.2),
        inset 0 0 40px rgba(252, 238, 10, 0.05);
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink), var(--neon-yellow), var(--neon-purple));
      z-index: -1;
      opacity: 0.3;
      filter: blur(10px);
    }

    .result-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      color: var(--neon-pink);
      letter-spacing: 4px;
      margin-bottom: 16px;
    }

    .result-code {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      color: var(--neon-yellow);
      letter-spacing: 6px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--neon-yellow);
      margin: 16px 0;
      text-shadow: 0 0 20px rgba(252, 238, 10, 0.6);
      word-break: break-all;
    }

    .result-hint {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 12px;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      animation: confettiFall 3s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* 消息提示 */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--panel-bg);
      border: 1px solid var(--neon-pink);
      color: #fff;
      padding: 14px 28px;
      font-size: 0.9rem;
      z-index: 200;
      opacity: 0;
      transition: all 0.4s;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .toast.error {
      border-color: #ff4444;
      color: #ff6666;
    }

    /* 密码弹窗 */
    .pwd-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.9);
      z-index: 150;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .pwd-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .pwd-box {
      background: var(--panel-bg);
      border: 2px solid var(--neon-pink);
      padding: 36px 40px;
      text-align: center;
      max-width: 90%;
      width: 380px;
      position: relative;
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
    }

    .pwd-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 18px; height: 18px;
      border-top: 3px solid var(--neon-pink);
      border-left: 3px solid var(--neon-pink);
    }

    .pwd-box::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 18px; height: 18px;
      border-bottom: 3px solid var(--neon-pink);
      border-right: 3px solid var(--neon-pink);
    }

    .pwd-title {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--neon-pink);
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .pwd-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 255, 0.4);
      color: var(--neon-cyan);
      padding: 14px 16px;
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .pwd-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
    }

    .pwd-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      font-size: 0.85rem;
    }

    .pwd-hint {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 12px;
      letter-spacing: 1px;
    }

    /* 自定义确认弹窗 */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.92);
      z-index: 160;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    .confirm-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .confirm-box {
      background: var(--panel-bg);
      border: 2px solid var(--neon-cyan);
      padding: 32px 36px;
      text-align: center;
      max-width: 90%;
      width: 400px;
      position: relative;
    }

    .confirm-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 18px; height: 18px;
      border-top: 3px solid var(--neon-cyan);
      border-left: 3px solid var(--neon-cyan);
    }

    .confirm-box::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 18px; height: 18px;
      border-bottom: 3px solid var(--neon-cyan);
      border-right: 3px solid var(--neon-cyan);
    }

    .confirm-msg {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .confirm-msg strong {
      color: var(--neon-yellow);
      font-family: 'Orbitron', monospace;
    }

    .confirm-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    /* 已参与提示 */
    .already-played {
      text-align: center;
      padding: 30px;
    }

    .already-played .big-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 15px var(--neon-pink));
    }

    .already-played h3 {
      font-family: 'Orbitron', monospace;
      color: var(--neon-pink);
      font-size: 1.3rem;
      margin-bottom: 12px;
      letter-spacing: 3px;
    }

    .already-played .your-code {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      color: var(--neon-yellow);
      padding: 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--neon-yellow);
      display: inline-block;
      margin-top: 12px;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(252, 238, 10, 0.5);
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .draw-wheel-container {
        width: 220px;
        height: 220px;
      }
      .result-card {
        padding: 28px 24px;
      }
      .result-code {
        font-size: 1.4rem;
      }
      .cyber-input-group {
        flex-direction: column;
      }
      .cyber-btn {
        width: 100%;
      }
    }

    /* 批量导入文本域 */
    .cyber-textarea {
      width: 100%;
      min-height: 100px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #fff;
      padding: 12px 16px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      margin-bottom: 12px;
    }

    .cyber-textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .cyber-textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* 底部 */
    footer {
      text-align: center;
      padding: 30px 0;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 3px;
      font-family: 'Orbitron', monospace;
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="scanlines"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <header>
      <h1 class="glitch-title" data-text="CYBER DRAW">CYBER DRAW</h1>
      <div class="subtitle">赛 博 优 惠 券 抽 奖 系 统</div>
    </header>

<!-- 抽奖记录弹窗 -->
    <div class="confirm-overlay" id="recordOverlay">
      <div class="confirm-box" style="max-width: 420px;">
        <div class="pwd-title" style="margin-bottom: 16px;">◆ 我的抽奖记录 ◆</div>
        <div id="recordContent">
          <!-- JS populated -->
        </div>
        <div class="confirm-btns" style="margin-top: 20px;">
          <button class="cyber-btn pink" onclick="closeRecordModal()" style="font-size: 0.8rem;">关闭</button>
        </div>
      </div>
    </div>

<!-- 用户抽奖区 -->
    <div class="cyber-card">
      <div class="card-inner">
        <div class="card-title"><span class="icon">◈</span> 抽奖中心</div>
          <div id="drawArea">
          <div class="user-form">
            <input type="email" class="cyber-input" id="username" placeholder="输入自己的 GPT 账号邮箱参与抽奖" maxlength="60">
          </div>

          <div class="draw-wheel-container">
            <div class="wheel-ring"></div>
            <div class="draw-wheel" id="drawWheel">
              <div class="wheel-inner"></div>
              <div class="wheel-center">
                <img class="wheel-icon" src="logo.jpg" alt="logo">
                <div class="wheel-text">ChatGPT</div>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="cyber-btn yellow draw-btn" id="drawBtn" onclick="startDraw()">
              <span class="btn-glitch">启动抽奖</span>
            </button>
            <button class="cyber-btn" style="font-size: 0.85rem; padding: 12px 24px;" onclick="showRecordModal()">
              <span>📋 查看抽奖记录</span>
            </button>
          </div>

          <p style="margin-top: 16px; font-size: 0.8rem; color: rgba(255,255,255,0.4);">
            每个邮箱每月仅限一次抽奖机会 | 抽中后优惠券自动失效
          </p>
        </div>


      </div>
    </div>

    <footer>
      CYBER DRAW SYSTEM v1.0 // POWERED BY NEON TECH
    </footer>
  </div>

  <!-- 结果弹窗 -->
    <div class="result-overlay" id="resultOverlay" onclick="closeResult(event)">
      <div class="result-card" onclick="event.stopPropagation()">
        <div class="result-label">◆ 抽中优惠券 ◆</div>
        <div style="font-size: 3rem; margin: 10px 0;">🎉</div>
        <div id="resultValue" style="font-family:'Orbitron',monospace; font-size:1.2rem; color:var(--neon-yellow); margin-bottom:8px; text-shadow:0 0 15px rgba(252,238,10,0.5);"></div>
        <div class="result-code" id="resultCode"></div>
        <p class="result-hint">请截图保存，每个编码仅限使用一次</p>
        <button class="cyber-btn" style="margin-top: 20px;" onclick="closeResult(); resetToDraw();">确认领取</button>
      </div>
    </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===================== 优惠券池（纯前端）=====================
    const USER_KEY = 'cyber_draw_user_v1';
    const USED_KEY = 'cyber_draw_used_v1';

    // ====== 在这里添加/修改优惠券编码 ======
    const COUPON_POOL = [
      // 5元券
      { code: 'CYBER5A001', value: 5 },
      { code: 'CYBER5A002', value: 5 },
      { code: 'CYBER5A003', value: 5 },
      { code: 'CYBER5A004', value: 5 },
      { code: 'CYBER5A005', value: 5 },
      // 3元券
      { code: 'CYBER3B001', value: 3 },
      { code: 'CYBER3B002', value: 3 },
      { code: 'CYBER3B003', value: 3 },
      { code: 'CYBER3B004', value: 3 },
      { code: 'CYBER3B005', value: 3 },
    ];
    // =====================================

    function getUsedCodes() {
      try {
        const raw = localStorage.getItem(USED_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return [];
    }

    function setUsedCodes(codes) {
      localStorage.setItem(USED_KEY, JSON.stringify(codes));
    }

    function getAvailableCoupons() {
      const used = getUsedCodes();
      return COUPON_POOL.filter(c => !used.includes(c.code));
    }

    function markCodeUsed(code) {
      const used = getUsedCodes();
      if (!used.includes(code)) {
        used.push(code);
        setUsedCodes(used);
      }
    }

    function getUserRecord() {
      try {
        const raw = localStorage.getItem(USER_KEY);
        if (raw) {
          const record = JSON.parse(raw);
          const now = new Date();
          const currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
          if (record.yearMonth && record.yearMonth === currentYearMonth) {
            return record;
          }
          localStorage.removeItem(USER_KEY);
        }
      } catch (e) {}
      return null;
    }

    function setUserRecord(record) {
      const now = new Date();
      const currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      record.yearMonth = currentYearMonth;
      localStorage.setItem(USER_KEY, JSON.stringify(record));
    }

    // ===================== 初始化粒子 =====================
    function initParticles() {
      const container = document.getElementById('particles');
      const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#fcee0a'];
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 10 + 8) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 6px ${p.style.background}`;
        container.appendChild(p);
      }
    }

    // ===================== UI 更新 =====================
    function updateStats() {
      const total = COUPON_POOL.length;
      const available = getAvailableCoupons();
      const available5 = available.filter(c => c.value === 5).length;
      const available3 = available.filter(c => c.value === 3).length;
      const used = total - available.length;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('available5').textContent = available5;
      document.getElementById('available3').textContent = available3;
      document.getElementById('usedCount').textContent = used;
      document.getElementById('userCount').textContent = used;
    }

    function renderCouponList() {
      const list = document.getElementById('couponList');
      const available = getAvailableCoupons();
      const used = getUsedCodes();
      if (COUPON_POOL.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.3); padding:20px; font-size:0.85rem;">暂无优惠券，请联系管理员添加</div>';
        return;
      }
      list.innerHTML = COUPON_POOL.map(c => {
        const isUsed = used.includes(c.code);
        return `<div class="coupon-item ${isUsed ? 'used' : ''}">
          <span>${escapeHtml(c.code)} <span class="value-tag v${c.value}">${c.value}元</span> <span class="coupon-tag ${isUsed ? 'used' : 'available'}">${isUsed ? '已使用' : '可用'}</span></span>
        </div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function resetToDraw() {
      document.getElementById('username').value = '';
      document.getElementById('username').focus();
    }

    // ===================== 抽奖逻辑 =====================
    let isDrawing = false;

    async function checkUserStatus() {
      const localRecord = getUserRecord();
      if (localRecord) {
        return true;
      }
      return false;
    }

    async function startDraw() {
      if (isDrawing) return;

      const username = document.getElementById('username').value.trim();
      if (!username) {
        showToast('请先输入你的邮箱', 'error');
        document.getElementById('username').focus();
        return;
      }

      // 检查本地存储（同一设备）
      const localRecord = getUserRecord();
      if (localRecord) {
        showToast('本月已参与过抽奖，请查看抽奖记录', 'info');
        return;
      }

      // 检查是否有可用优惠券
      const available = getAvailableCoupons();
      if (available.length === 0) {
        showToast('优惠券已被抽完，下次再来吧', 'error');
        return;
      }

      isDrawing = true;
      const btn = document.getElementById('drawBtn');
      const wheel = document.getElementById('drawWheel');
      btn.disabled = true;
      wheel.classList.add('spinning');

      // 模拟抽奖动画延迟
      await new Promise(r => setTimeout(r, 2000));

      // 随机选取
      const winner = available[Math.floor(Math.random() * available.length)];
      markCodeUsed(winner.code);
      setUserRecord({ code: winner.code, value: winner.value, time: new Date().toISOString() });

      // 停止动画
      wheel.classList.remove('spinning');
      isDrawing = false;
      btn.disabled = false;

      showResult(winner.code, winner.value);
      updateStats();
    }

    function showRecordModal() {
      const record = getUserRecord();
      const container = document.getElementById('recordContent');
      if (!record) {
        container.innerHTML = '<p style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px 0;">📭 暂无抽奖记录<br><span style="font-size: 0.75rem; color: rgba(255,255,255,0.3);">本月还没有参与抽奖，快去试试吧！</span></p>';
      } else {
        const time = record.time ? new Date(record.time).toLocaleString('zh-CN') : '未知时间';
        container.innerHTML = '<div style="background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); border-radius: 8px; padding: 20px; text-align: center;"><div style="font-family: Orbitron, monospace; font-size: 1.3rem; color: var(--neon-yellow); text-shadow: 0 0 12px rgba(252,238,10,0.4); margin-bottom: 12px;">◆ ' + (record.value || 3) + '元优惠券 ◆</div><div style="font-family: Orbitron, monospace; font-size: 1.1rem; color: var(--neon-cyan); letter-spacing: 2px; background: rgba(0,0,0,0.3); padding: 10px 16px; border-radius: 4px; word-break: break-all;">' + record.code + '</div><div style="color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 16px;">抽奖时间：' + time + '</div><p style="color: rgba(255,255,255,0.3); font-size: 0.75rem; margin-top: 12px;">请妥善保管，每个编码仅限使用一次</p></div>';
      }
      document.getElementById('recordOverlay').classList.add('active');
    }

    function closeRecordModal() {
      document.getElementById('recordOverlay').classList.remove('active');
    }

    function showResult(code, value) {
      document.getElementById('resultCode').textContent = code;
      document.getElementById('resultValue').textContent = `◆ ${value}元优惠券 ◆`;
      document.getElementById('resultOverlay').classList.add('active');
      createConfetti();
    }

    function closeResult(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('resultOverlay').classList.remove('active');
    }

    function createConfetti() {
      const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#fcee0a', '#ff4444'];
      const overlay = document.getElementById('resultOverlay');
      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (Math.random() * 2 + 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        c.style.width = (Math.random() * 6 + 4) + 'px';
        c.style.height = (Math.random() * 6 + 4) + 'px';
        overlay.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    // ===================== 初始化 =====================
    initParticles();
    updateStats();
    checkUserStatus();

    // Enter键触发抽奖
    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startDraw();
    });
  </script>
</body>
</html>

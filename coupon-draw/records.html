<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽奖记录 - Cyber Draw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ff;
      --neon-yellow: #fce40a;
      --neon-purple: #bd00ff;
      --bg-dark: #050510;
      --glass: rgba(0, 243, 255, 0.05);
      --border: rgba(0, 243, 255, 0.3);
      --text: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 243, 255, 0.03) 0%, transparent 50%);
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Logo */
    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--neon-pink);
      text-align: center;
      letter-spacing: 6px;
      margin-bottom: 16px;
    }

    /* Cyber card */
    .cyber-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink));
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .card-title .icon { color: var(--neon-pink); margin-right: 6px; }

    /* Record display */
    .record-box {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .record-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 12px rgba(252, 238, 10, 0.4);
      margin-bottom: 12px;
    }

    .record-code {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 16px;
      border-radius: 4px;
      display: inline-block;
      word-break: break-all;
    }

    .record-time {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 16px;
    }

    .record-hint {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
      margin-top: 16px;
    }

    .no-record {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
    }

    .no-record .big-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Buttons */
    .cyber-btn {
      position: relative;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(189, 0, 255, 0.15));
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 14px 32px;
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      overflow: hidden;
      width: 100%;
    }

    .cyber-btn:hover {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(189, 0, 255, 0.3));
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
      transform: translateY(-2px);
    }

    .cyber-btn.pink {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.15), rgba(189, 0, 255, 0.15));
    }

    .cyber-btn.pink:hover {
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(189, 0, 255, 0.3));
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
    }

    footer {
      margin-top: auto;
      padding: 20px 0;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .logo { font-size: 1.6rem; }
      .cyber-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">CYBER DRAW</div>
    <div class="subtitle">赛 博 优 惠 券 抽 奖 系 统</div>

    <div class="cyber-card">
      <div class="card-title"><span class="icon">◈</span> 我的抽奖记录</div>
      <div id="recordContent">
        <!-- JS will populate this -->
      </div>
    </div>

    <button class="cyber-btn pink" onclick="window.location.href='index.html'">
      ↩ 返回抽奖页面
    </button>
  </div>

  <footer>CYBER DRAW SYSTEM v1.0 // POWERED BY NEON TECH</footer>

  <script>
    const USER_KEY = 'cyber_draw_user_v1';

    function getUserRecord() {
      try {
        const raw = localStorage.getItem(USER_KEY);
        if (raw) {
          const record = JSON.parse(raw);
          const now = new Date();
          const currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
          if (record.yearMonth && record.yearMonth === currentYearMonth) {
            return record;
          }
          localStorage.removeItem(USER_KEY);
        }
      } catch (e) {}
      return null;
    }

    function renderRecord() {
      const container = document.getElementById('recordContent');
      const record = getUserRecord();
      if (!record) {
        container.innerHTML = `
          <div class="no-record">
            <div class="big-icon">📭</div>
            <p>暂无抽奖记录</p>
            <p style="font-size: 0.75rem; margin-top: 8px; color: rgba(255,255,255,0.3);">本月还没有参与抽奖，快去试试吧！</p>
          </div>
        `;
        return;
      }
      const time = record.time ? new Date(record.time).toLocaleString('zh-CN') : '未知时间';
      container.innerHTML = `
        <div class="record-box">
          <div class="record-value">◆ ${record.value || 3}元优惠券 ◆</div>
          <div class="record-code">${record.code}</div>
          <div class="record-time">抽奖时间：${time}</div>
          <p class="record-hint">请妥善保管，每个编码仅限使用一次</p>
        </div>
      `;
    }

    renderRecord();
  </script>
</body>
</html>
